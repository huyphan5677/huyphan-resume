<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phan Minh Huy - Data Scientist Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F1419;
            --surface: #161C23;
            --border: #232B35;
            --text: #D9DEE4;
            --text-muted: #8B96A3;
            --accent: #7FA7C9;
            --accent-soft: rgba(127, 167, 201, 0.12);
            --radius: 8px;
            --max: 960px;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; scroll-padding-top: 80px; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 4px;
        }

        .wrap {
            max-width: var(--max);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ---------- Nav ---------- */
        .nav {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
        }

        .nav .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            height: 60px;
        }

        .nav-brand {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }

        .nav-links a {
            display: inline-flex;
            align-items: center;
            min-height: 40px;
            padding: 0 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-radius: 6px;
            transition: color 200ms var(--ease), background-color 200ms var(--ease);
        }

        .nav-links a:hover,
        .nav-links a.active { color: var(--text); }

        .nav-links a.active { background: var(--accent-soft); }

        .nav-links a { gap: 8px; }

        .nav-links svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-links a.active svg { color: var(--accent); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            transition: border-color 200ms var(--ease), background-color 200ms var(--ease);
            white-space: nowrap;
        }

        .btn:hover { border-color: var(--accent); background: var(--accent-soft); }

        .btn svg, .contact-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- Hero ---------- */
        .hero { padding: 96px 0 72px; }

        .hero h1 {
            font-size: clamp(2.25rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .hero .title {
            margin-top: 12px;
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--accent);
        }

        .hero .bio {
            margin-top: 24px;
            max-width: 64ch;
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .contact {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 24px;
            margin-top: 32px;
        }

        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 32px;
            font-size: 0.92rem;
            color: var(--text-muted);
            transition: color 200ms var(--ease);
        }

        a.contact-item:hover { color: var(--text); }

        /* ---------- Sections ---------- */
        .section {
            padding: 56px 0;
            border-top: 1px solid var(--border);
        }

        .section-label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* Indent section content a little from its label */
        .section > :not(.section-label) { margin-left: 24px; }

        /* ---------- Experience timeline ---------- */
        .timeline { position: relative; }

        .job {
            position: relative;
            padding: 0 0 40px 28px;
            border-left: 1px solid var(--border);
        }

        .job:last-child { padding-bottom: 0; }

        .job::before {
            content: "";
            position: absolute;
            left: -5px;
            top: 8px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--bg);
            border: 2px solid var(--text-muted);
        }

        .job:first-child::before { border-color: var(--accent); background: var(--accent); }

        .job-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 4px 16px;
        }

        .job-role { font-size: 1.1rem; font-weight: 600; }

        .job-date {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .job-company {
            margin-top: 2px;
            font-size: 0.95rem;
            color: var(--accent);
        }

        .job-company span { color: var(--text-muted); }

        .bullets {
            margin-top: 14px;
            list-style: none;
            display: grid;
            gap: 8px;
        }

        .bullets li {
            position: relative;
            padding-left: 18px;
            color: var(--text);
            font-size: 0.96rem;
        }

        .bullets li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: 0.72em;
            width: 6px;
            height: 1px;
            background: var(--text-muted);
        }

        .bullets .bullets {
            margin-top: 8px;
            gap: 6px;
        }

        .bullets .bullets li {
            color: var(--text-muted);
            font-size: 0.93rem;
        }

        /* First-level bullets: solid accent triangle; nested bullets keep the muted dash */
        .job > .bullets > li::before {
            left: 3px;
            top: 0.54em;
            width: 0;
            height: 0;
            background: none;
            border-left: 6px solid var(--accent);
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
        }

        /* ---------- Education ---------- */
        .edu-list { display: grid; gap: 24px; }

        .edu-item {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 4px 16px;
        }

        .edu-degree { font-weight: 600; }

        .edu-school { color: var(--text-muted); font-size: 0.95rem; }

        /* ---------- Skills ---------- */
        .skill-groups { display: grid; gap: 28px; }

        .skill-group h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; }

        .chip {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.88rem;
            color: var(--text);
            background: var(--surface);
        }

        /* ---------- Footer ---------- */
        footer {
            padding: 40px 0 72px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 760px) {
            .wrap { padding: 0 16px; }
            .nav-links { display: none; }
            .hero { padding: 56px 0 48px; }
            .section { padding: 40px 0; }
            .section-label { margin-bottom: 20px; }
            .section > :not(.section-label) { margin-left: 0; }
            .job { padding-left: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <nav class="nav" aria-label="Main">
        <div class="wrap">
            <a href="#top" class="nav-brand" id="nav-name">Phan Minh Huy</a>
            <ul class="nav-links">
                <li><a href="#about"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>About Me</a></li>
                <li><a href="#experience"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>Experience</a></li>
                <li><a href="#education"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>Education</a></li>
                <li><a href="#skills"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Skills</a></li>
            </ul>
            <a href="resume.html" class="btn" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                Resume
            </a>
        </div>
    </nav>

    <main class="wrap" id="top">
        <header class="hero" id="about">
            <h1 id="name"></h1>
            <p class="title" id="title"></p>
            <p class="bio" id="bio"></p>
            <div class="contact" id="contact"></div>
        </header>

        <section class="section" id="experience" aria-labelledby="experience-label">
            <h2 class="section-label" id="experience-label">Experience</h2>
            <div class="timeline" id="experience-list"></div>
        </section>

        <section class="section" id="education" aria-labelledby="education-label">
            <h2 class="section-label" id="education-label">Education</h2>
            <div class="edu-list" id="education-list"></div>
        </section>

        <section class="section" id="skills" aria-labelledby="skills-label">
            <h2 class="section-label" id="skills-label">Skills</h2>
            <div class="skill-groups" id="skills-list"></div>
        </section>
    </main>

    <footer>
        <div class="wrap" id="footer"></div>
    </footer>

    <script src="config.js"></script>
    <script>
        const ICONS = {
            mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
            phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
            pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
            linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/>'
        };

        const esc = (s) => String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const icon = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

        function renderBullets(items) {
            return `<ul class="bullets">${items.map((item) => {
                if (typeof item === 'object' && item.main) {
                    return `<li>${esc(item.main)}${renderBullets(item.sub)}</li>`;
                }
                return `<li>${esc(item)}</li>`;
            }).join('')}</ul>`;
        }

        function render() {
            const c = window.portfolioConfig;
            const p = c.personal;

            document.getElementById('name').textContent = p.name;
            document.getElementById('nav-name').textContent = p.name;
            document.getElementById('title').textContent = p.title;
            document.getElementById('bio').textContent = p.bio;

            const contact = [
                `<a class="contact-item" href="mailto:${esc(p.email)}">${icon('mail')}${esc(p.email)}</a>`,
                `<a class="contact-item" href="tel:${esc(p.phone.replace(/\s+/g, ''))}">${icon('phone')}${esc(p.phone)}</a>`,
                `<span class="contact-item">${icon('pin')}${esc(p.location)}</span>`
            ];
            if (p.linkedin) {
                contact.push(`<a class="contact-item" href="${esc(p.linkedin)}" target="_blank" rel="noopener">${icon('linkedin')}LinkedIn</a>`);
            }
            document.getElementById('contact').innerHTML = contact.join('');

            document.getElementById('experience-list').innerHTML = c.experience.map((job) => `
                <article class="job">
                    <div class="job-head">
                        <h3 class="job-role">${esc(job.position)}</h3>
                        <span class="job-date">${esc(job.duration)}</span>
                    </div>
                    <div class="job-company">${esc(job.company)} <span>· ${esc(job.location)}</span></div>
                    ${renderBullets(job.achievements)}
                </article>
            `).join('');

            document.getElementById('education-list').innerHTML = c.education.map((edu) => `
                <div class="edu-item">
                    <div>
                        <div class="edu-degree">${esc(edu.degree)}</div>
                        <div class="edu-school">${esc(edu.institution)}</div>
                    </div>
                    <span class="job-date">${esc(edu.duration)}</span>
                </div>
            `).join('');

            const groups = Object.entries(c.skills).map(([name, list]) => `
                <div class="skill-group">
                    <h3>${esc(name.charAt(0).toUpperCase() + name.slice(1))}</h3>
                    <div class="chips">${list.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>
                </div>
            `);
            if (c.languages && c.languages.length) {
                groups.push(`
                    <div class="skill-group">
                        <h3>Languages</h3>
                        <div class="chips">${c.languages.map((l) => `<span class="chip">${esc(l.name)}</span>`).join('')}</div>
                    </div>
                `);
            }
            document.getElementById('skills-list').innerHTML = groups.join('');

            document.getElementById('footer').textContent = `© ${new Date().getFullYear()} ${p.name}`;
        }

        function trackActiveSection() {
            const links = [...document.querySelectorAll('.nav-links a')];
            const byId = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]));
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    links.forEach((a) => a.classList.remove('active'));
                    const link = byId.get(entry.target.id);
                    if (link) link.classList.add('active');
                });
            }, { rootMargin: '-40% 0px -55% 0px' });
            byId.forEach((_, id) => {
                const el = document.getElementById(id);
                if (el) observer.observe(el);
            });
        }

        render();
        trackActiveSection();
    </script>
</body>
</html>
