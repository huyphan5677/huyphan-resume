<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>G · Slate Mix — Phan Minh Huy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F1419;
            --surface: #161C23;
            --surface-2: #1B222B;
            --border: #232B35;
            --border-hover: #303A47;
            --text: #D9DEE4;
            --text-muted: #8B96A3;
            --accent: #7FA7C9;
            --accent-soft: rgba(127, 167, 201, 0.12);
            --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace;
            --max: 1040px;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; scroll-padding-top: 88px; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

        svg.i {
            width: 16px; height: 16px; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 1.75;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

        /* ---------- Floating tab bar (layout of the original site, dark palette) ---------- */
        .tabbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            max-width: calc(100vw - 16px);
            background: rgba(22, 28, 35, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-top: 0;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            transition: color 200ms var(--ease), background-color 200ms var(--ease);
        }

        .tab:hover { color: var(--text); background: rgba(127, 167, 201, 0.06); }

        .tab.active { color: var(--text); background: var(--accent-soft); }

        .tab.active svg.i { color: var(--accent); }

        .tab.resume {
            margin-left: 6px;
            padding: 0 16px;
            border-radius: 999px;
            background: rgba(127, 167, 201, 0.16);
            border: 1px solid rgba(127, 167, 201, 0.35);
            color: var(--accent);
            font-weight: 600;
        }

        .tab.resume:hover { background: rgba(127, 167, 201, 0.24); color: var(--text); }

        /* ---------- Hero ---------- */
        .hero { padding: 136px 0 64px; }

        .hero h1 {
            font-size: clamp(2.25rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .hero .title { margin-top: 12px; font-size: 1.15rem; font-weight: 500; color: var(--accent); }

        .hero .bio { margin-top: 24px; max-width: 66ch; color: var(--text-muted); font-size: 1.05rem; line-height: 1.7; }

        .contact { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 28px; }

        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            font-size: 0.92rem;
            color: var(--text-muted);
            transition: color 200ms var(--ease);
        }

        a.contact-item:hover { color: var(--text); }

        /* ---------- Sections ---------- */
        section { padding: 48px 0; border-top: 1px solid var(--border); }

        .section-title {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Experience: card blocks (from C) */
        .jobs { display: grid; gap: 16px; }

        .job {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 24px;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            transition: border-color 200ms var(--ease);
        }

        .job:hover { border-color: var(--border-hover); }

        .job-date { font-size: 0.85rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

        .job-company { margin-top: 6px; font-weight: 600; color: var(--accent); }

        .job-loc { font-size: 0.85rem; color: var(--text-muted); }

        .job-role { font-size: 1.1rem; font-weight: 600; }

        .bullets { list-style: none; display: grid; gap: 8px; margin-top: 12px; }

        .bullets li { position: relative; padding-left: 18px; font-size: 0.95rem; }

        .bullets li::before {
            content: "";
            position: absolute;
            left: 2px; top: 0.72em;
            width: 6px; height: 1px;
            background: var(--text-muted);
        }

        .bullets .bullets { margin-top: 8px; gap: 6px; }

        .bullets .bullets li { color: var(--text-muted); font-size: 0.92rem; }

        /* Education */
        .edu-list { display: grid; gap: 20px; }

        .edu-item { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; padding: 0 24px; }

        .edu-degree { font-weight: 600; }

        .edu-school { color: var(--text-muted); font-size: 0.95rem; }

        /* Skills: notebook style (from D) */
        .skills { display: grid; gap: 20px; }

        .chips-label { font-family: var(--mono); font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; }

        .chip {
            padding: 5px 11px;
            border-radius: 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 0.8rem;
        }

        footer { padding: 32px 0 96px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.88rem; }

        /* ---------- Responsive ---------- */
        @media (max-width: 860px) {
            .tab .label-long { display: none; }
        }

        @media (max-width: 760px) {
            .wrap { padding: 0 16px; }
            .tabbar {
                left: 0;
                right: 0;
                transform: none;
                max-width: none;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
                padding: 6px 8px;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .tabbar::-webkit-scrollbar { display: none; }
            .tab { padding: 0 12px; }
            .hero { padding: 96px 0 48px; }
            section { padding: 40px 0; }
            .job { grid-template-columns: 1fr; gap: 12px; padding: 20px; }
            .edu-item { grid-template-columns: 1fr; gap: 2px; padding: 0; }
        }

        @media (max-width: 560px) {
            .tabbar { gap: 2px; padding: 4px; overflow: visible; }
            .tab,
            .tab.resume {
                flex: 1 1 0;
                flex-direction: column;
                justify-content: center;
                gap: 3px;
                min-height: 52px;
                min-width: 0;
                padding: 4px 2px;
                margin: 0;
                border-radius: 10px;
                font-size: 0.7rem;
            }
            .tab svg.i { width: 18px; height: 18px; }
            .hero { padding-top: 92px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <nav class="tabbar" aria-label="Main" id="tabbar"></nav>

    <main class="wrap">
        <header class="hero" id="about">
            <h1 id="name"></h1>
            <p class="title" id="title"></p>
            <p class="bio" id="bio"></p>
            <div class="contact" id="contact"></div>
        </header>

        <section id="experience" aria-labelledby="exp-title">
            <h2 class="section-title" id="exp-title">Experience</h2>
            <div class="jobs" id="experience-list"></div>
        </section>

        <section id="education" aria-labelledby="edu-title">
            <h2 class="section-title" id="edu-title">Education</h2>
            <div class="edu-list" id="education-list"></div>
        </section>

        <section id="skills" aria-labelledby="skills-title">
            <h2 class="section-title" id="skills-title">Skills</h2>
            <div class="skills" id="skills-list"></div>
        </section>
    </main>

    <footer><div class="wrap" id="footer"></div></footer>

    <script src="../../config.js"></script>
    <script src="../shared/preview.js"></script>
    <script>
        const { esc, icon, phoneHref, renderBullets, mountSwitcher } = Preview;
        const c = window.portfolioConfig;
        const p = c.personal;

        // Extra icons for the tab bar (Lucide-style, same stroke as the shared set)
        const TAB_ICONS = {
            user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
            briefcase: '<rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
            cap: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
            code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
            download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>'
        };
        const tabIcon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${TAB_ICONS[name]}</svg>`;

        const TABS = [
            { id: 'about', icon: 'user', label: 'About', long: ' Me' },
            { id: 'experience', icon: 'briefcase', label: 'Experience' },
            { id: 'education', icon: 'cap', label: 'Education' },
            { id: 'skills', icon: 'code', label: 'Skills' }
        ];

        document.getElementById('tabbar').innerHTML = TABS.map((t) => `
            <a href="#${t.id}" class="tab" data-target="${t.id}">
                ${tabIcon(t.icon)}<span>${t.label}${t.long ? `<span class="label-long">${t.long}</span>` : ''}</span>
            </a>
        `).join('') + `
            <a href="../../resume.html" class="tab resume" target="_blank" rel="noopener">${tabIcon('download')}<span>Resume</span></a>
        `;

        document.getElementById('name').textContent = p.name;
        document.getElementById('title').textContent = p.title;
        document.getElementById('bio').textContent = p.bio;

        const contact = [
            `<a class="contact-item" href="mailto:${esc(p.email)}">${icon('mail')}${esc(p.email)}</a>`,
            `<a class="contact-item" href="${phoneHref(p.phone)}">${icon('phone')}${esc(p.phone)}</a>`,
            `<span class="contact-item">${icon('pin')}${esc(p.location)}</span>`
        ];
        if (p.linkedin) {
            contact.push(`<a class="contact-item" href="${esc(p.linkedin)}" target="_blank" rel="noopener">${icon('linkedin')}LinkedIn</a>`);
        }
        document.getElementById('contact').innerHTML = contact.join('');

        document.getElementById('experience-list').innerHTML = c.experience.map((job) => `
            <article class="job">
                <div>
                    <div class="job-date">${esc(job.duration)}</div>
                    <div class="job-company">${esc(job.company)}</div>
                    <div class="job-loc">${esc(job.location)}</div>
                </div>
                <div>
                    <h3 class="job-role">${esc(job.position)}</h3>
                    ${renderBullets(job.achievements)}
                </div>
            </article>
        `).join('');

        document.getElementById('education-list').innerHTML = c.education.map((edu) => `
            <div class="edu-item">
                <div class="job-date">${esc(edu.duration)}</div>
                <div>
                    <div class="edu-degree">${esc(edu.degree)}</div>
                    <div class="edu-school">${esc(edu.institution)}</div>
                </div>
            </div>
        `).join('');

        const skillBlocks = Object.entries(c.skills).map(([name, list]) => `
            <div>
                <div class="chips-label">${esc(name)}</div>
                <div class="chips">${list.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>
            </div>
        `);
        if (c.languages && c.languages.length) {
            skillBlocks.push(`
                <div>
                    <div class="chips-label">languages</div>
                    <div class="chips">${c.languages.map((l) => `<span class="chip">${esc(l.name)}</span>`).join('')}</div>
                </div>
            `);
        }
        document.getElementById('skills-list').innerHTML = skillBlocks.join('');

        document.getElementById('footer').textContent = `© ${new Date().getFullYear()} ${p.name}`;

        // Highlight the tab of the section in view
        const tabs = [...document.querySelectorAll('.tab[data-target]')];
        const setActive = (id) => tabs.forEach((t) => t.classList.toggle('active', t.dataset.target === id));
        setActive('about');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => { if (entry.isIntersecting) setActive(entry.target.id); });
        }, { rootMargin: '-35% 0px -60% 0px' });
        TABS.forEach((t) => { const el = document.getElementById(t.id); if (el) observer.observe(el); });

        mountSwitcher('g');
    </script>
</body>
</html>
