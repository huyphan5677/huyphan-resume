<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>H · Notebook Clean — Phan Minh Huy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F1419;
            --surface: #161C23;
            --surface-2: #1B222B;
            --border: #232B35;
            --border-hover: #303A47;
            --text: #D9DEE4;
            --text-muted: #8B96A3;
            --accent: #7FA7C9;
            --accent-soft: rgba(127, 167, 201, 0.12);
            --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; scroll-padding-top: 84px; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

        svg.i {
            width: 16px; height: 16px; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 1.75;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .wrap { max-width: 1000px; margin: 0 auto; padding: 104px 24px 120px; }

        /* ---------- Floating tab bar (same as G / original site) ---------- */
        .tabbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            max-width: calc(100vw - 16px);
            background: rgba(22, 28, 35, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-top: 0;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            transition: color 200ms var(--ease), background-color 200ms var(--ease);
        }

        .tab:hover { color: var(--text); background: rgba(127, 167, 201, 0.06); }

        .tab.active { color: var(--text); background: var(--accent-soft); }

        .tab.active svg.i { color: var(--accent); }

        .tab.resume {
            margin-left: 6px;
            padding: 0 16px;
            border-radius: 999px;
            background: rgba(127, 167, 201, 0.16);
            border: 1px solid rgba(127, 167, 201, 0.35);
            color: var(--accent);
            font-weight: 600;
        }

        .tab.resume:hover { background: rgba(127, 167, 201, 0.24); color: var(--text); }

        /* ---------- Cells (notebook layout, no code inputs) ---------- */
        .cell {
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .prompt {
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: right;
            padding-top: 22px;
        }

        .prompt b { color: var(--accent); font-weight: 500; }

        .cell-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 2px solid var(--border);
            border-radius: 8px;
            padding: 20px 24px 22px;
            transition: border-color 200ms var(--ease);
        }

        .cell:hover .cell-box { border-left-color: var(--accent); }

        .cell-title {
            font-family: var(--mono);
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Profile */
        .cell-box h1 {
            font-size: clamp(2rem, 5vw, 2.75rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .role { margin-top: 6px; color: var(--accent); font-weight: 500; }

        .bio { margin-top: 16px; max-width: 66ch; color: var(--text-muted); }

        .kv {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 6px 20px;
            margin-top: 20px;
            font-family: var(--mono);
            font-size: 0.82rem;
        }

        .kv dt { color: var(--text-muted); }

        .kv dd { overflow-wrap: anywhere; }

        .kv dd a:hover { color: var(--accent); }

        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.8rem;
            cursor: pointer;
            transition: border-color 200ms var(--ease), background-color 200ms var(--ease);
        }

        .btn:hover { border-color: var(--accent); background: var(--accent-soft); }

        .btn.is-done { color: var(--accent); border-color: var(--accent); }

        /* Career chart */
        .chart-note { margin-top: 12px; font-family: var(--mono); font-size: 0.75rem; color: var(--text-muted); }

        /* Experience */
        .job + .job { margin-top: 28px; padding-top: 24px; border-top: 1px dashed var(--border); }

        .job-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; align-items: baseline; }

        .job-role { font-size: 1.05rem; font-weight: 600; }

        .job-date { font-family: var(--mono); font-size: 0.78rem; color: var(--text-muted); }

        .job-org { color: var(--accent); font-size: 0.92rem; }

        .job-org span { color: var(--text-muted); }

        .bullets { list-style: none; display: grid; gap: 7px; margin-top: 12px; }

        .bullets li { position: relative; padding-left: 18px; font-size: 0.95rem; }

        .bullets li::before {
            content: "-";
            position: absolute; left: 2px; top: 0;
            font-family: var(--mono);
            color: var(--text-muted);
        }

        .bullets .bullets { margin-top: 6px; gap: 5px; }

        .bullets .bullets li { color: var(--text-muted); font-size: 0.92rem; }

        /* Education table */
        .table-scroll { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }

        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }

        th:first-child, td:first-child { padding-left: 0; }

        th { font-family: var(--mono); font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }

        td.mono { font-family: var(--mono); font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }

        tr:last-child td { border-bottom: 0; }

        /* Skills chips */
        .chips-label { font-family: var(--mono); font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }

        .chips + .chips-label { margin-top: 16px; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; }

        .chip {
            padding: 4px 10px;
            border-radius: 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 0.78rem;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 860px) {
            .tab .label-long { display: none; }
        }

        @media (max-width: 760px) {
            .wrap { padding: 88px 16px 104px; }
            .tabbar {
                left: 0; right: 0; transform: none; max-width: none;
                border-radius: 0; border-left: 0; border-right: 0;
                padding: 6px 8px;
            }
            .cell { grid-template-columns: 1fr; gap: 4px; }
            .prompt { text-align: left; padding-top: 0; }
            .cell-box { padding: 16px 16px 18px; }
        }

        @media (max-width: 560px) {
            .tabbar { gap: 2px; padding: 4px; }
            .tab,
            .tab.resume {
                flex: 1 1 0;
                flex-direction: column;
                justify-content: center;
                gap: 3px;
                min-height: 52px;
                min-width: 0;
                padding: 4px 2px;
                margin: 0;
                border-radius: 10px;
                font-size: 0.7rem;
            }
            .tab svg.i { width: 18px; height: 18px; }
            .wrap { padding-top: 80px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <nav class="tabbar" aria-label="Main" id="tabbar"></nav>

    <main class="wrap">
        <section class="cell" id="about" aria-label="About">
            <div class="prompt" aria-hidden="true">[<b>1</b>]</div>
            <div class="cell-box">
                <h1 id="name"></h1>
                <p class="role" id="title"></p>
                <p class="bio" id="bio"></p>
                <dl class="kv" id="kv"></dl>
                <div class="actions">
                    <button type="button" class="btn" id="copy-email"></button>
                    <a class="btn" href="../../resume.html" target="_blank" rel="noopener" id="resume"></a>
                </div>
            </div>
        </section>

        <section class="cell" id="career" aria-labelledby="career-title">
            <div class="prompt" aria-hidden="true">[<b>2</b>]</div>
            <div class="cell-box">
                <h2 class="cell-title" id="career-title">career timeline</h2>
                <div id="chart"></div>
                <p class="chart-note">Highlighted bar = current role</p>
            </div>
        </section>

        <section class="cell" id="experience" aria-labelledby="exp-title">
            <div class="prompt" aria-hidden="true">[<b>3</b>]</div>
            <div class="cell-box">
                <h2 class="cell-title" id="exp-title">experience</h2>
                <div id="experience-list"></div>
            </div>
        </section>

        <section class="cell" id="education" aria-labelledby="edu-title">
            <div class="prompt" aria-hidden="true">[<b>4</b>]</div>
            <div class="cell-box">
                <h2 class="cell-title" id="edu-title">education</h2>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>degree</th><th>institution</th><th>period</th></tr></thead>
                        <tbody id="education-list"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="cell" id="skills" aria-labelledby="skills-title">
            <div class="prompt" aria-hidden="true">[<b>5</b>]</div>
            <div class="cell-box">
                <h2 class="cell-title" id="skills-title">skills</h2>
                <div id="skills-list"></div>
            </div>
        </section>
    </main>

    <script src="../../config.js"></script>
    <script src="../shared/preview.js"></script>
    <script>
        const { esc, icon, phoneHref, renderBullets, careerChart, bindCopyEmail, mountSwitcher } = Preview;
        const c = window.portfolioConfig;
        const p = c.personal;

        const TAB_ICONS = {
            user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
            briefcase: '<rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
            cap: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
            code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
            download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>'
        };
        const tabIcon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${TAB_ICONS[name]}</svg>`;

        const TABS = [
            { id: 'about', icon: 'user', label: 'About', long: ' Me' },
            { id: 'experience', icon: 'briefcase', label: 'Experience' },
            { id: 'education', icon: 'cap', label: 'Education' },
            { id: 'skills', icon: 'code', label: 'Skills' }
        ];

        document.getElementById('tabbar').innerHTML = TABS.map((t) => `
            <a href="#${t.id}" class="tab" data-target="${t.id}">
                ${tabIcon(t.icon)}<span>${t.label}${t.long ? `<span class="label-long">${t.long}</span>` : ''}</span>
            </a>
        `).join('') + `
            <a href="../../resume.html" class="tab resume" target="_blank" rel="noopener">${tabIcon('download')}<span>Resume</span></a>
        `;

        document.getElementById('name').textContent = p.name;
        document.getElementById('title').textContent = p.title;
        document.getElementById('bio').textContent = p.bio;

        const kv = [
            ['email', `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`],
            ['phone', `<a href="${phoneHref(p.phone)}">${esc(p.phone)}</a>`],
            ['location', esc(p.location)]
        ];
        if (p.linkedin) kv.push(['linkedin', `<a href="${esc(p.linkedin)}" target="_blank" rel="noopener">${esc(p.linkedin.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>`]);
        document.getElementById('kv').innerHTML = kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

        bindCopyEmail(document.getElementById('copy-email'), p.email);
        document.getElementById('resume').innerHTML = `${icon('file')}<span>Resume</span>`;

        const chartEl = document.getElementById('chart');
        let lastChartWidth = 0;
        const drawChart = () => {
            const width = chartEl.clientWidth;
            if (!width || width === lastChartWidth) return;
            lastChartWidth = width;
            chartEl.innerHTML = careerChart(c.experience, { width });
        };
        drawChart();
        if ('ResizeObserver' in window) new ResizeObserver(drawChart).observe(chartEl);

        document.getElementById('experience-list').innerHTML = c.experience.map((job) => `
            <article class="job">
                <div class="job-head">
                    <h3 class="job-role">${esc(job.position)}</h3>
                    <span class="job-date">${esc(job.duration)}</span>
                </div>
                <div class="job-org">${esc(job.company)} <span>· ${esc(job.location)}</span></div>
                ${renderBullets(job.achievements)}
            </article>
        `).join('');

        document.getElementById('education-list').innerHTML = c.education.map((edu) => `
            <tr>
                <td>${esc(edu.degree)}</td>
                <td>${esc(edu.institution)}</td>
                <td class="mono">${esc(edu.duration)}</td>
            </tr>
        `).join('');

        const skillBlocks = Object.entries(c.skills).map(([name, list]) => `
            <div class="chips-label">${esc(name)}</div>
            <div class="chips">${list.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>
        `);
        if (c.languages && c.languages.length) {
            skillBlocks.push(`
                <div class="chips-label">languages</div>
                <div class="chips">${c.languages.map((l) => `<span class="chip">${esc(l.name)}</span>`).join('')}</div>
            `);
        }
        document.getElementById('skills-list').innerHTML = skillBlocks.join('');

        // Highlight the tab of the section in view (career counts as experience)
        const tabs = [...document.querySelectorAll('.tab[data-target]')];
        const setActive = (id) => tabs.forEach((t) => t.classList.toggle('active', t.dataset.target === id));
        setActive('about');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                setActive(entry.target.id === 'career' ? 'experience' : entry.target.id);
            });
        }, { rootMargin: '-35% 0px -60% 0px' });
        ['about', 'career', 'experience', 'education', 'skills'].forEach((id) => {
            const el = document.getElementById(id);
            if (el) observer.observe(el);
        });

        mountSwitcher('h');
    </script>
</body>
</html>
