<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>F · Split Sticky — Phan Minh Huy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F1216;
            --surface: #151920;
            --surface-2: #1A1F27;
            --border: #252B35;
            --text: #DADDE3;
            --text-muted: #8E95A1;
            --accent: #9DA8DA;
            --accent-soft: rgba(157, 168, 218, 0.12);
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

        svg.i {
            width: 16px; height: 16px; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 1.75;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
            gap: 72px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ---------- Sidebar ---------- */
        aside {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 88px 0 48px;
        }

        aside h1 {
            font-size: clamp(2.2rem, 3.4vw, 2.9rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .role { margin-top: 10px; font-size: 1.1rem; font-weight: 500; color: var(--accent); }

        .tagline { margin-top: 16px; max-width: 34ch; color: var(--text-muted); font-size: 0.95rem; }

        .side-nav { list-style: none; margin-top: 48px; display: grid; gap: 2px; }

        .side-nav a {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            min-height: 36px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 200ms var(--ease);
        }

        .side-nav a::before {
            content: "";
            width: 28px;
            height: 1px;
            background: currentColor;
            transition: width 200ms var(--ease);
        }

        .side-nav a:hover,
        .side-nav a.active { color: var(--text); }

        .side-nav a.active::before { width: 56px; background: var(--accent); }

        .side-bottom { display: grid; gap: 20px; }

        .actions { display: flex; flex-wrap: wrap; gap: 8px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 0.86rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 200ms var(--ease), background-color 200ms var(--ease), color 200ms var(--ease);
        }

        .btn:hover { border-color: var(--accent); background: var(--accent-soft); }

        .btn.primary { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

        .btn.is-done { color: var(--accent); border-color: var(--accent); }

        .icon-links { display: flex; gap: 4px; }

        .icon-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            color: var(--text-muted);
            transition: color 200ms var(--ease), background-color 200ms var(--ease);
        }

        .icon-links a:hover { color: var(--text); background: var(--surface); }

        .icon-links svg.i { width: 18px; height: 18px; }

        .lang {
            display: inline-flex;
            padding: 3px;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: max-content;
        }

        .lang button {
            min-width: 44px;
            min-height: 32px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 200ms var(--ease), color 200ms var(--ease);
        }

        .lang button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }

        /* ---------- Main ---------- */
        main { padding: 88px 0 120px; min-width: 0; }

        section { margin-bottom: 88px; scroll-margin-top: 48px; }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .about p { color: var(--text-muted); font-size: 1.02rem; }

        .about p::first-line { color: var(--text); }

        /* Case studies */
        .cases { display: grid; gap: 16px; }

        .case {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: border-color 200ms var(--ease);
        }

        .case:hover { border-color: #323A47; }

        .case-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; align-items: baseline; }

        .case h3 { font-size: 1.12rem; font-weight: 600; }

        .case-org { font-size: 0.82rem; color: var(--text-muted); }

        .case dl {
            display: grid;
            grid-template-columns: 96px minmax(0, 1fr);
            gap: 10px 16px;
            margin-top: 16px;
            font-size: 0.93rem;
        }

        .case dt {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            padding-top: 3px;
        }

        .case dd { color: var(--text-muted); }

        .case dd.result { color: var(--text); }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }

        .chip {
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 500;
        }

        .chip.neutral { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

        /* Experience */
        .jobs { display: grid; gap: 8px; }

        .job {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr);
            gap: 20px;
            padding: 20px;
            margin: 0 -20px;
            border-radius: 12px;
            transition: background-color 200ms var(--ease);
        }

        .job:hover { background: var(--surface); }

        .job-date { font-size: 0.8rem; color: var(--text-muted); padding-top: 3px; font-variant-numeric: tabular-nums; }

        .job h3 { font-size: 1.02rem; font-weight: 600; line-height: 1.4; }

        .job h3 span { color: var(--accent); font-weight: 500; }

        .job-loc { font-size: 0.82rem; color: var(--text-muted); }

        .bullets { list-style: none; display: grid; gap: 7px; margin-top: 10px; }

        .bullets li { position: relative; padding-left: 16px; font-size: 0.93rem; color: var(--text-muted); }

        .bullets li::before {
            content: "";
            position: absolute; left: 2px; top: 0.72em;
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--border);
        }

        .bullets .bullets { margin-top: 6px; gap: 5px; }

        .edu { display: grid; gap: 16px; }

        .edu-item { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; }

        .edu-item h3 { font-size: 0.98rem; font-weight: 600; }

        .edu-item p { font-size: 0.88rem; color: var(--text-muted); }

        .skill-group + .skill-group { margin-top: 20px; }

        .skill-group h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; }

        .skill-group .chips { margin-top: 0; }

        /* ---------- Responsive ---------- */
        @media (max-width: 960px) {
            .layout { grid-template-columns: 1fr; gap: 0; padding: 0 16px; }
            aside { position: static; height: auto; padding: 56px 0 24px; gap: 28px; }
            .side-nav { display: none; }
            main { padding: 32px 0 104px; }
            section { margin-bottom: 64px; }
            .section-title {
                position: sticky; top: 0; z-index: 5;
                margin: 0 -16px 20px; padding: 14px 16px;
                background: rgba(15, 18, 22, 0.9);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }
            .job { grid-template-columns: 1fr; gap: 4px; margin: 0; padding: 16px 0; }
            .job:hover { background: none; }
            .edu-item { grid-template-columns: 1fr; gap: 2px; }
            .case { padding: 20px; }
            .case dl { grid-template-columns: 1fr; gap: 2px; }
            .case dd + dt { margin-top: 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside>
            <div>
                <h1 id="name"></h1>
                <p class="role" id="title"></p>
                <p class="tagline" id="tagline"></p>
                <nav aria-label="Sections">
                    <ul class="side-nav" id="side-nav"></ul>
                </nav>
            </div>
            <div class="side-bottom">
                <div class="lang" role="group" aria-label="Language">
                    <button type="button" data-lang="en" aria-pressed="false">EN</button>
                    <button type="button" data-lang="vi" aria-pressed="false">VI</button>
                </div>
                <div class="actions">
                    <button type="button" class="btn primary" id="copy-email"></button>
                    <a class="btn" href="../../resume.html" target="_blank" rel="noopener" id="resume"></a>
                </div>
                <div class="icon-links" id="icon-links"></div>
            </div>
        </aside>

        <main>
            <section id="about" class="about">
                <h2 class="section-title" data-label="about"></h2>
                <p id="bio"></p>
            </section>

            <section id="cases">
                <h2 class="section-title" data-label="cases"></h2>
                <div class="cases" id="case-list"></div>
            </section>

            <section id="experience">
                <h2 class="section-title" data-label="experience"></h2>
                <div class="jobs" id="job-list"></div>
            </section>

            <section id="education">
                <h2 class="section-title" data-label="education"></h2>
                <div class="edu" id="edu-list"></div>
            </section>

            <section id="skills">
                <h2 class="section-title" data-label="skills"></h2>
                <div id="skill-list"></div>
            </section>
        </main>
    </div>

    <script src="../../config.js"></script>
    <script src="vi.js"></script>
    <script src="../shared/preview.js"></script>
    <script>
        const { esc, icon, phoneHref, renderBullets, bindCopyEmail, mountSwitcher, CASE_STUDIES } = Preview;
        const c = window.portfolioConfig;
        const vi = window.portfolioVi;

        const LABELS_EN = {
            about: 'About', cases: 'Case studies', experience: 'Experience', education: 'Education', skills: 'Skills',
            resume: 'View resume', copyEmail: 'Copy email', copied: 'Copied',
            context: 'Context', approach: 'Approach', result: 'Result',
            technical: 'Technical', soft: 'Soft skills', languages: 'Languages'
        };

        const MONTH_NUM = { Jan: '01', Feb: '02', Mar: '03', Apr: '04', May: '05', Jun: '06', Jul: '07', Aug: '08', Sep: '09', Oct: '10', Nov: '11', Dec: '12' };

        const viDuration = (s) => String(s)
            .replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{4})/g, (_, m, y) => `${MONTH_NUM[m]}/${y}`)
            .replace(/Present/g, vi.labels.present)
            .replace(/Completed/g, 'Hoàn thành');

        function firstSentence(text) {
            const match = String(text).match(/^.*?[.!?](\s|$)/);
            return match ? match[0].trim() : text;
        }

        function render(lang) {
            const isVi = lang === 'vi';
            const L = isVi ? vi.labels : LABELS_EN;
            const p = c.personal;
            const bio = isVi ? vi.personal.bio : p.bio;
            const loc = (s) => (isVi && vi.locations[s]) || s;
            const dur = (s) => (isVi ? viDuration(s) : s);

            document.documentElement.lang = isVi ? 'vi' : 'en';
            document.getElementById('name').textContent = p.name;
            document.getElementById('title').textContent = isVi ? vi.personal.title : p.title;
            document.getElementById('tagline').textContent = firstSentence(bio);
            document.getElementById('bio').textContent = bio;

            document.querySelectorAll('[data-label]').forEach((el) => { el.textContent = L[el.dataset.label]; });

            document.getElementById('side-nav').innerHTML = ['about', 'cases', 'experience', 'education', 'skills']
                .map((id) => `<li><a href="#${id}">${esc(L[id])}</a></li>`).join('');

            document.getElementById('resume').innerHTML = `${icon('file')}<span>${esc(L.resume)}</span>`;

            document.getElementById('case-list').innerHTML = CASE_STUDIES.map((cs) => {
                const t = isVi ? cs.vi : cs.en;
                const metrics = isVi ? cs.metricsVi : cs.metrics;
                const neutral = cs.id === 'platform' || cs.id === 'nutri';
                return `
                    <article class="case">
                        <div class="case-head">
                            <h3>${esc(t.title)}</h3>
                            <span class="case-org">${esc(cs.org)} · ${esc(cs.period)}</span>
                        </div>
                        <dl>
                            <dt>${esc(L.context)}</dt><dd>${esc(t.context)}</dd>
                            <dt>${esc(L.approach)}</dt><dd>${esc(t.approach)}</dd>
                            <dt>${esc(L.result)}</dt><dd class="result">${esc(t.result)}</dd>
                        </dl>
                        <div class="chips">${metrics.map((m) => `<span class="chip${neutral ? ' neutral' : ''}">${esc(m)}</span>`).join('')}</div>
                    </article>
                `;
            }).join('');

            document.getElementById('job-list').innerHTML = c.experience.map((job, i) => `
                <article class="job">
                    <div class="job-date">${esc(dur(job.duration))}</div>
                    <div>
                        <h3>${esc(job.position)} <span>· ${esc(job.company)}</span></h3>
                        <div class="job-loc">${esc(loc(job.location))}</div>
                        ${renderBullets(isVi && vi.experience[i] ? vi.experience[i] : job.achievements)}
                    </div>
                </article>
            `).join('');

            document.getElementById('edu-list').innerHTML = c.education.map((edu, i) => {
                const t = (isVi && vi.education[i]) || edu;
                return `
                    <div class="edu-item">
                        <div class="job-date">${esc(dur(edu.duration))}</div>
                        <div>
                            <h3>${esc(t.degree)}</h3>
                            <p>${esc(t.institution)}</p>
                        </div>
                    </div>
                `;
            }).join('');

            const groups = Object.entries(c.skills).map(([name, list]) => `
                <div class="skill-group">
                    <h3>${esc(L[name] || name)}</h3>
                    <div class="chips">${list.map((s) => `<span class="chip neutral">${esc(s)}</span>`).join('')}</div>
                </div>
            `);
            if (c.languages && c.languages.length) {
                groups.push(`
                    <div class="skill-group">
                        <h3>${esc(L.languages)}</h3>
                        <div class="chips">${c.languages.map((l) => `<span class="chip neutral">${esc(isVi && l.name === 'English' ? 'Tiếng Anh' : l.name)}</span>`).join('')}</div>
                    </div>
                `);
            }
            document.getElementById('skill-list').innerHTML = groups.join('');

            document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));

            const oldBtn = document.getElementById('copy-email');
            const btn = oldBtn.cloneNode(false);
            oldBtn.replaceWith(btn);
            bindCopyEmail(btn, p.email, { idle: L.copyEmail, done: L.copied });

            trackActiveSection();
        }

        let observer;
        function trackActiveSection() {
            if (observer) observer.disconnect();
            const links = [...document.querySelectorAll('.side-nav a')];
            const byId = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]));
            observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    links.forEach((a) => a.classList.remove('active'));
                    const link = byId.get(entry.target.id);
                    if (link) link.classList.add('active');
                });
            }, { rootMargin: '-30% 0px -65% 0px' });
            byId.forEach((_, id) => { const el = document.getElementById(id); if (el) observer.observe(el); });
            if (links[0] && !links.some((a) => a.classList.contains('active'))) links[0].classList.add('active');
        }

        const p = c.personal;
        document.getElementById('icon-links').innerHTML = `
            <a href="mailto:${esc(p.email)}" aria-label="Email">${icon('mail')}</a>
            <a href="${phoneHref(p.phone)}" aria-label="Phone">${icon('phone')}</a>
            ${p.linkedin ? `<a href="${esc(p.linkedin)}" target="_blank" rel="noopener" aria-label="LinkedIn">${icon('linkedin')}</a>` : ''}
        `;

        let lang = 'en';
        try { lang = localStorage.getItem('preview-f-lang') === 'vi' ? 'vi' : 'en'; } catch (e) { /* storage unavailable */ }
        const langParam = new URLSearchParams(location.search).get('lang');
        if (langParam === 'vi' || langParam === 'en') lang = langParam;

        document.querySelectorAll('.lang button').forEach((b) => {
            b.addEventListener('click', () => {
                lang = b.dataset.lang;
                try { localStorage.setItem('preview-f-lang', lang); } catch (e) { /* storage unavailable */ }
                render(lang);
            });
        });

        render(lang);
        mountSwitcher('f');
    </script>
</body>
</html>
