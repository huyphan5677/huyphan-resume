<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>D · Notebook — Phan Minh Huy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111418;
            --surface: #161A1F;
            --surface-2: #1B2027;
            --border: #252B33;
            --text: #D6DBE1;
            --text-muted: #8A94A0;
            --accent: #7DB5B8;
            --accent-soft: rgba(125, 181, 184, 0.12);
            --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

        svg.i {
            width: 16px; height: 16px; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 1.75;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 120px; }

        /* ---------- Top bar ---------- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 0 24px 84px;
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .topbar .file { display: inline-flex; align-items: center; gap: 8px; }

        .kernel { display: inline-flex; align-items: center; gap: 8px; }

        .kernel::before {
            content: "";
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent);
        }

        /* ---------- Cells ---------- */
        .cell {
            display: grid;
            grid-template-columns: 72px minmax(0, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .prompt {
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: right;
            padding-top: 14px;
            white-space: nowrap;
        }

        .prompt b { color: var(--accent); font-weight: 500; }

        .cell-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 2px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 200ms var(--ease);
        }

        .cell:hover .cell-box { border-left-color: var(--accent); }

        .code {
            padding: 12px 16px;
            font-family: var(--mono);
            font-size: 0.85rem;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            overflow-x: auto;
            white-space: pre;
        }

        .code .fn { color: var(--accent); }
        .code .id { color: var(--text); }
        .code .str { color: #A9B7C6; }

        .out { padding: 20px 20px 22px; }

        /* Profile cell */
        .out h1 {
            font-size: clamp(2rem, 5vw, 2.75rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .role { margin-top: 6px; color: var(--accent); font-weight: 500; }

        .bio { margin-top: 16px; max-width: 64ch; color: var(--text-muted); }

        .kv {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 6px 20px;
            margin-top: 20px;
            font-family: var(--mono);
            font-size: 0.82rem;
        }

        .kv dt { color: var(--text-muted); }

        .kv dd a:hover { color: var(--accent); }

        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.8rem;
            cursor: pointer;
            transition: border-color 200ms var(--ease), background-color 200ms var(--ease);
        }

        .btn:hover { border-color: var(--accent); background: var(--accent-soft); }

        .btn.is-done { color: var(--accent); border-color: var(--accent); }

        /* Chart cell */
        .chart-note { margin-top: 12px; font-family: var(--mono); font-size: 0.75rem; color: var(--text-muted); }

        /* Experience cell */
        .job + .job { margin-top: 28px; padding-top: 24px; border-top: 1px dashed var(--border); }

        .job-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; align-items: baseline; }

        .job-role { font-size: 1.05rem; font-weight: 600; }

        .job-date { font-family: var(--mono); font-size: 0.78rem; color: var(--text-muted); }

        .job-org { color: var(--accent); font-size: 0.92rem; }

        .job-org span { color: var(--text-muted); }

        .bullets { list-style: none; display: grid; gap: 7px; margin-top: 12px; }

        .bullets li { position: relative; padding-left: 18px; font-size: 0.95rem; }

        .bullets li::before {
            content: "-";
            position: absolute; left: 2px; top: 0;
            font-family: var(--mono);
            color: var(--text-muted);
        }

        .bullets .bullets { margin-top: 6px; gap: 5px; }

        .bullets .bullets li { color: var(--text-muted); font-size: 0.92rem; }

        /* Table cell */
        table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }

        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }

        th { font-family: var(--mono); font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }

        td.mono { font-family: var(--mono); font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }

        tr:last-child td { border-bottom: 0; }

        .table-scroll { overflow-x: auto; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; }

        .chip {
            padding: 4px 10px;
            border-radius: 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 0.78rem;
        }

        .chips + .chips-label { margin-top: 16px; }

        .chips-label { font-family: var(--mono); font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }

        @media (max-width: 680px) {
            .wrap { padding: 24px 16px 104px; }
            .topbar { padding-left: 0; }
            .cell { grid-template-columns: 1fr; gap: 4px; }
            .prompt { text-align: left; padding-top: 0; }
            .out { padding: 16px; }
        }

        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="topbar">
            <span class="file">portfolio.ipynb</span>
            <span class="kernel">Python 3 · idle</span>
        </div>

        <div class="cell">
            <div class="prompt">In [<b>1</b>]:</div>
            <div class="cell-box">
                <div class="code"><span class="id">me</span> = <span class="fn">load_profile</span>(<span class="str">"phan_minh_huy"</span>)</div>
                <div class="out">
                    <h1 id="name"></h1>
                    <p class="role" id="title"></p>
                    <p class="bio" id="bio"></p>
                    <dl class="kv" id="kv"></dl>
                    <div class="actions">
                        <button type="button" class="btn" id="copy-email"></button>
                        <a class="btn" href="../../resume.html" target="_blank" rel="noopener" id="resume"></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="cell">
            <div class="prompt">In [<b>2</b>]:</div>
            <div class="cell-box">
                <div class="code"><span class="id">me</span>.career.<span class="fn">plot</span>(kind=<span class="str">"timeline"</span>)</div>
                <div class="out">
                    <div id="chart"></div>
                    <p class="chart-note">Highlighted bar = current role</p>
                </div>
            </div>
        </div>

        <div class="cell">
            <div class="prompt">In [<b>3</b>]:</div>
            <div class="cell-box">
                <div class="code"><span class="id">me</span>.<span class="fn">experience</span>()</div>
                <div class="out" id="experience"></div>
            </div>
        </div>

        <div class="cell">
            <div class="prompt">In [<b>4</b>]:</div>
            <div class="cell-box">
                <div class="code"><span class="id">me</span>.education.<span class="fn">to_frame</span>()</div>
                <div class="out table-scroll">
                    <table>
                        <thead><tr><th>degree</th><th>institution</th><th>period</th></tr></thead>
                        <tbody id="education"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="cell">
            <div class="prompt">In [<b>5</b>]:</div>
            <div class="cell-box">
                <div class="code"><span class="id">me</span>.<span class="fn">skills</span></div>
                <div class="out" id="skills"></div>
            </div>
        </div>
    </main>

    <script src="../../config.js"></script>
    <script src="../shared/preview.js"></script>
    <script>
        const { esc, icon, phoneHref, renderBullets, careerChart, bindCopyEmail, mountSwitcher } = Preview;
        const c = window.portfolioConfig;
        const p = c.personal;

        document.getElementById('name').textContent = p.name;
        document.getElementById('title').textContent = p.title;
        document.getElementById('bio').textContent = p.bio;

        const kv = [
            ['email', `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`],
            ['phone', `<a href="${phoneHref(p.phone)}">${esc(p.phone)}</a>`],
            ['location', esc(p.location)]
        ];
        if (p.linkedin) kv.push(['linkedin', `<a href="${esc(p.linkedin)}" target="_blank" rel="noopener">${esc(p.linkedin.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>`]);
        document.getElementById('kv').innerHTML = kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

        bindCopyEmail(document.getElementById('copy-email'), p.email);
        document.getElementById('resume').innerHTML = `${icon('file')}<span>Resume</span>`;

        const chartEl = document.getElementById('chart');
        let lastChartWidth = 0;
        const drawChart = () => {
            const width = chartEl.clientWidth;
            if (!width || width === lastChartWidth) return;
            lastChartWidth = width;
            chartEl.innerHTML = careerChart(c.experience, { width });
        };
        drawChart();
        if ('ResizeObserver' in window) new ResizeObserver(drawChart).observe(chartEl);

        document.getElementById('experience').innerHTML = c.experience.map((job) => `
            <article class="job">
                <div class="job-head">
                    <h2 class="job-role">${esc(job.position)}</h2>
                    <span class="job-date">${esc(job.duration)}</span>
                </div>
                <div class="job-org">${esc(job.company)} <span>· ${esc(job.location)}</span></div>
                ${renderBullets(job.achievements)}
            </article>
        `).join('');

        document.getElementById('education').innerHTML = c.education.map((edu) => `
            <tr>
                <td>${esc(edu.degree)}</td>
                <td>${esc(edu.institution)}</td>
                <td class="mono">${esc(edu.duration)}</td>
            </tr>
        `).join('');

        const skillBlocks = Object.entries(c.skills).map(([name, list]) => `
            <div class="chips-label">${esc(name)}</div>
            <div class="chips">${list.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>
        `);
        if (c.languages && c.languages.length) {
            skillBlocks.push(`
                <div class="chips-label">languages</div>
                <div class="chips">${c.languages.map((l) => `<span class="chip">${esc(l.name)}</span>`).join('')}</div>
            `);
        }
        document.getElementById('skills').innerHTML = skillBlocks.join('');

        mountSwitcher('d');
    </script>
</body>
</html>
