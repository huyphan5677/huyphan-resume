<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Design Previews — A to F</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #101215;
            --surface: #16191E;
            --border: #262A31;
            --border-hover: #363C46;
            --text: #DADDE2;
            --text-muted: #8D949E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 6px; }

        .wrap { max-width: 1080px; margin: 0 auto; padding: 64px 24px 96px; }

        h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 700; letter-spacing: -0.02em; }

        .intro { margin-top: 12px; max-width: 62ch; color: var(--text-muted); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 40px;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            transition: border-color 200ms ease;
        }

        .card:hover { border-color: var(--border-hover); }

        .card-head { display: flex; align-items: center; gap: 14px; }

        .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0F1115;
        }

        .card h2 { font-size: 1.1rem; font-weight: 600; }

        .card .tag { font-size: 0.8rem; color: var(--text-muted); }

        .card p { font-size: 0.92rem; color: var(--text-muted); }

        .swatches { display: flex; gap: 6px; }

        .swatches span {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .open { margin-top: auto; font-size: 0.88rem; font-weight: 500; color: var(--text); }

        .open::after { content: " →"; }

        .current {
            display: inline-block;
            margin-top: 32px;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .current:hover { color: var(--text); }

        @media (max-width: 560px) { .wrap { padding: 40px 16px 72px; } }

        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>Chọn giao diện: A – F</h1>
        <p class="intro">6 bản thử, đều tông tối và dịu. Mở từng bản để xem; trong mỗi trang có thanh A–F ở góc dưới bên phải để chuyển nhanh. Chọn xong chỉ cần nhắn lại chữ cái.</p>

        <div class="grid" id="grid"></div>

        <a class="current" href="../">Xem trang hiện tại (đang dùng)</a>
    </main>

    <script>
        const OPTIONS = [
            {
                id: 'a', name: 'Slate Minimal', tag: 'Xanh xám · Inter',
                desc: 'Tối giản, nhiều khoảng trống. Menu dính trên đầu, kinh nghiệm dạng timeline.',
                colors: ['#0F1419', '#161C23', '#D9DEE4', '#7FA7C9']
            },
            {
                id: 'b', name: 'Graphite', tag: 'Than chì + tím oải hương · IBM Plex + Mono',
                desc: 'Một cột, nhãn đánh số 01/02/03, ngày tháng font mono. Có nút sao chép email.',
                colors: ['#121214', '#1A1A1D', '#E2E2E6', '#ABA6D0']
            },
            {
                id: 'c', name: 'Bento Dark', tag: 'Xanh rêu · Inter',
                desc: 'Màn hình đầu là lưới ô: giới thiệu, 4 số liệu nổi bật, kỹ năng, học vấn, liên hệ.',
                colors: ['#0E1311', '#151B18', '#DCE3DE', '#86B39A']
            },
            {
                id: 'd', name: 'Notebook', tag: 'Xanh ngọc nhạt · Inter + Mono',
                desc: 'Mỗi phần là một cell kiểu Jupyter. Có biểu đồ timeline sự nghiệp và nút sao chép email.',
                colors: ['#111418', '#161A1F', '#D6DBE1', '#7DB5B8']
            },
            {
                id: 'e', name: 'Editorial', tag: 'Hồng đất nhạt · Newsreader serif',
                desc: 'Một cột hẹp như bài viết, tiêu đề serif. Có nút sao chép email.',
                colors: ['#131416', '#18191C', '#E6E4E1', '#C9A1A7']
            },
            {
                id: 'f', name: 'Split Sticky', tag: 'Xanh chàm nhạt · Inter',
                desc: 'Cột trái cố định, cột phải cuộn. Có Case studies, chuyển EN/VI và nút sao chép email.',
                colors: ['#0F1216', '#151920', '#DADDE3', '#9DA8DA']
            }
        ];

        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        document.getElementById('grid').innerHTML = OPTIONS.map((o) => `
            <a class="card" href="${o.id}/" aria-label="Bản ${o.id.toUpperCase()}: ${esc(o.name)}">
                <div class="card-head">
                    <span class="letter" style="background:${o.colors[3]}">${o.id.toUpperCase()}</span>
                    <div>
                        <h2>${esc(o.name)}</h2>
                        <div class="tag">${esc(o.tag)}</div>
                    </div>
                </div>
                <div class="swatches" aria-hidden="true">${o.colors.map((c) => `<span style="background:${c}"></span>`).join('')}</div>
                <p>${esc(o.desc)}</p>
                <span class="open">Mở bản ${o.id.toUpperCase()}</span>
            </a>
        `).join('');
    </script>
</body>
</html>
