<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>B · Graphite — Phan Minh Huy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121214;
            --surface: #1A1A1D;
            --border: #2A2A2F;
            --text: #E2E2E6;
            --text-muted: #9A9AA4;
            --accent: #ABA6D0;
            --accent-soft: rgba(171, 166, 208, 0.12);
            --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

        .wrap { max-width: 820px; margin: 0 auto; padding: 0 24px; }

        svg.i {
            width: 16px; height: 16px; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 1.75;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ---------- Header ---------- */
        header { padding: 112px 0 64px; }

        .kicker {
            font-family: var(--mono);
            font-size: 0.82rem;
            color: var(--accent);
            letter-spacing: 0.02em;
        }

        h1 {
            margin-top: 16px;
            font-size: clamp(2.4rem, 6vw, 3.75rem);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.05;
        }

        .bio {
            margin-top: 24px;
            max-width: 62ch;
            font-size: 1.08rem;
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 200ms var(--ease), background-color 200ms var(--ease), color 200ms var(--ease);
        }

        .btn:hover { border-color: var(--accent); background: var(--accent-soft); }

        .btn.primary { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

        .btn.is-done { color: var(--accent); border-color: var(--accent); }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 24px;
            margin-top: 24px;
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .meta span, .meta a { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; }

        .meta a:hover { color: var(--text); }

        /* ---------- Sections ---------- */
        section { padding: 48px 0; border-top: 1px solid var(--border); }

        .label {
            font-family: var(--mono);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .label b { color: var(--accent); font-weight: 500; }

        .entry {
            display: grid;
            grid-template-columns: 160px minmax(0, 1fr);
            gap: 24px;
            padding-bottom: 40px;
        }

        .entry:last-child { padding-bottom: 0; }

        .entry-date {
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--text-muted);
            padding-top: 4px;
            line-height: 1.6;
        }

        .entry-role { font-size: 1.1rem; font-weight: 600; line-height: 1.4; }

        .entry-org { color: var(--accent); font-size: 0.95rem; }

        .entry-org span { color: var(--text-muted); }

        .bullets { list-style: none; display: grid; gap: 8px; margin-top: 12px; }

        .bullets li { position: relative; padding-left: 20px; font-size: 0.96rem; }

        .bullets li::before {
            content: "›";
            position: absolute;
            left: 4px;
            top: 0;
            color: var(--text-muted);
            font-family: var(--mono);
        }

        .bullets .bullets { margin-top: 6px; gap: 6px; }

        .bullets .bullets li { color: var(--text-muted); font-size: 0.93rem; }

        .bullets .bullets li::before { content: "·"; }

        .skills { display: grid; gap: 20px; }

        .skill-row { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 24px; }

        .skill-row h3 { font-family: var(--mono); font-size: 0.78rem; font-weight: 500; color: var(--text-muted); padding-top: 3px; }

        .skill-row p { font-size: 0.96rem; }

        .skill-row p span + span::before { content: " / "; color: var(--text-muted); }

        footer { padding: 32px 0 96px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 0.78rem; color: var(--text-muted); }

        @media (max-width: 640px) {
            .wrap { padding: 0 16px; }
            header { padding: 64px 0 48px; }
            .entry, .skill-row { grid-template-columns: 1fr; gap: 6px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <header>
            <p class="kicker" id="kicker"></p>
            <h1 id="name"></h1>
            <p class="bio" id="bio"></p>
            <div class="actions">
                <button type="button" class="btn primary" id="copy-email"></button>
                <a class="btn" id="linkedin" target="_blank" rel="noopener"></a>
                <a class="btn" href="../../resume.html" target="_blank" rel="noopener" id="resume"></a>
            </div>
            <div class="meta" id="meta"></div>
        </header>

        <section aria-labelledby="exp-label">
            <h2 class="label" id="exp-label"><b>01</b> — Experience</h2>
            <div id="experience"></div>
        </section>

        <section aria-labelledby="edu-label">
            <h2 class="label" id="edu-label"><b>02</b> — Education</h2>
            <div id="education"></div>
        </section>

        <section aria-labelledby="skills-label">
            <h2 class="label" id="skills-label"><b>03</b> — Skills</h2>
            <div class="skills" id="skills"></div>
        </section>
    </main>

    <footer><div class="wrap" id="footer"></div></footer>

    <script src="../../config.js"></script>
    <script src="../shared/preview.js"></script>
    <script>
        const { esc, icon, phoneHref, renderBullets, bindCopyEmail, mountSwitcher } = Preview;
        const c = window.portfolioConfig;
        const p = c.personal;

        document.getElementById('kicker').textContent = `${p.title} — ${p.location}`;
        document.getElementById('name').textContent = p.name;
        document.getElementById('bio').textContent = p.bio;

        bindCopyEmail(document.getElementById('copy-email'), p.email);

        const linkedin = document.getElementById('linkedin');
        if (p.linkedin) {
            linkedin.href = p.linkedin;
            linkedin.innerHTML = `${icon('linkedin')}<span>LinkedIn</span>`;
        } else {
            linkedin.remove();
        }
        document.getElementById('resume').innerHTML = `${icon('file')}<span>Resume</span>`;

        document.getElementById('meta').innerHTML = `
            <a href="mailto:${esc(p.email)}">${icon('mail')}${esc(p.email)}</a>
            <a href="${phoneHref(p.phone)}">${icon('phone')}${esc(p.phone)}</a>
        `;

        document.getElementById('experience').innerHTML = c.experience.map((job) => `
            <article class="entry">
                <div class="entry-date">${esc(job.duration)}</div>
                <div>
                    <h3 class="entry-role">${esc(job.position)}</h3>
                    <div class="entry-org">${esc(job.company)} <span>· ${esc(job.location)}</span></div>
                    ${renderBullets(job.achievements)}
                </div>
            </article>
        `).join('');

        document.getElementById('education').innerHTML = c.education.map((edu) => `
            <article class="entry">
                <div class="entry-date">${esc(edu.duration)}</div>
                <div>
                    <h3 class="entry-role">${esc(edu.degree)}</h3>
                    <div class="entry-org"><span>${esc(edu.institution)}</span></div>
                </div>
            </article>
        `).join('');

        const skillRows = Object.entries(c.skills).map(([name, list]) => `
            <div class="skill-row">
                <h3>${esc(name)}</h3>
                <p>${list.map((s) => `<span>${esc(s)}</span>`).join('')}</p>
            </div>
        `);
        if (c.languages && c.languages.length) {
            skillRows.push(`
                <div class="skill-row">
                    <h3>languages</h3>
                    <p>${c.languages.map((l) => `<span>${esc(l.name)}</span>`).join('')}</p>
                </div>
            `);
        }
        document.getElementById('skills').innerHTML = skillRows.join('');

        document.getElementById('footer').textContent = `© ${new Date().getFullYear()} ${p.name}`;

        mountSwitcher('b');
    </script>
</body>
</html>
